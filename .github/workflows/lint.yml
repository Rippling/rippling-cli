name: Lint
on:
  pull_request:
  workflow_dispatch:
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.18'
      - name: Run Linter
        run: ./run_ruff.sh

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.18'

      - name: Install poetry
        run: python -m pip install poetry

      - run: poetry install

      - name: mypy
        run: poetry run mypy ./rippling_cli
