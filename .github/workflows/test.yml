name: Test
on:
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.18'

      - name: Install poetry
        run: python -m pip install poetry

      - run: poetry install

      - name: pytest
        run: poetry run pytest
